<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Control de cartera</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#14212b;--muted:#5d6b77;--line:#e2e7ec;
  --brand:#0f766e;--brand-ink:#fff;--soft:#e6f4f2;
  --ent:#2563eb;--cob:#16a34a;--vto:#d97706;--mora:#dc2626;
  --ok-bg:#e8f7ee;--ok:#15803d;--warn-bg:#fff4e0;--warn:#a16207;--bad-bg:#fdecec;--bad:#b91c1c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1418;--card:#162027;--ink:#e6edf1;--muted:#97a6b1;--line:#24323b;
    --brand:#2dd4bf;--brand-ink:#05201d;--soft:#12302d;
    --ent:#60a5fa;--cob:#4ade80;--vto:#fbbf24;--mora:#f87171;
    --ok-bg:#12301f;--ok:#4ade80;--warn-bg:#33270e;--warn:#fbbf24;--bad-bg:#3a1616;--bad:#fca5a5;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
header.top h1{font-size:18px;margin:0;flex:1}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:10px 0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.neu{background:var(--soft);color:var(--brand)}
.banner{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.info{background:var(--soft);color:var(--ink)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
/* calendar */
.calhead{display:flex;align-items:center;gap:6px;margin:6px 0 8px}
.calhead h2{flex:1;margin:0;font-size:18px;text-transform:capitalize;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0;font-weight:600}
.cal .d{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:54px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.cal .d.out{visibility:hidden}
.cal .d .n{font-size:14px;font-weight:600}
.cal .d.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal .d.today .n{color:var(--brand)}
.cal .d.hasmora{background:var(--bad-bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%}
.dot.ent{background:var(--ent)}.dot.cob{background:var(--cob)}.dot.vto{background:var(--vto)}.dot.mora{background:var(--mora)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-word}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.big{grid-column:1/-1}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;min-height:38px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
/* lists */
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sec-t{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 4px;font-weight:700}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.q.mora{border-color:var(--mora)}
.q .br{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin-top:6px}
.q .br div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.q .tot{font-weight:800}
/* forms */
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
input.i,select.i,textarea.i{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px}
textarea.i{min-height:70px}
input.i:focus,select.i:focus{outline:2px solid var(--brand);outline-offset:0}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{flex:1;min-width:70px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios label span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-weight:700;cursor:pointer;background:var(--bg)}
.radios input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.err{color:var(--bad);font-size:13px;margin-top:4px;min-height:0}
.prev{background:var(--bg);border-radius:10px;padding:10px;font-size:14px;margin-top:8px}
.prev table{width:100%;border-collapse:collapse}
.prev td{padding:3px 2px;font-variant-numeric:tabular-nums}
.prev td:not(:first-child){text-align:right}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;display:none;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain}
.sheet .in{max-width:640px;margin:0 auto;padding:6px 16px 24px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px}
.sheet .sh{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);padding:8px 0;z-index:1}
.sheet .sh h3{flex:1;margin:0;font-size:18px}
body.sheet-open{overflow:hidden}
body.sheet-open .scrim,body.sheet-open .sheet{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:90vw;display:none}
/* lock */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
#lock.on{display:flex}
.pins{display:flex;gap:14px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand)}
.pins i.f{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:600;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.search{margin:6px 0}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
.tag-confirm{display:inline-block;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 6px;margin-left:4px}
.sched input.i{min-height:40px;padding:6px 8px;font-size:15px}
.sched .r{display:grid;grid-template-columns:28px 1.3fr 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
@media (min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="title">Control de cartera</h1><span id="hdrx"></span></div></header>
<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in">
  <button data-tab="cal" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
  <button data-tab="res"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
  <button data-tab="cli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>Clientes</button>
  <button data-tab="pre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M6 10v5M18 10v5"/></svg>Préstamos</button>
  <button data-tab="aju"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="in"><div class="sh"><h3 id="sheetT"></h3><button class="iconbtn" data-act="close" aria-label="Cerrar">✕</button></div><div id="sheetB"></div></div></div>
<div class="toast" id="toast"></div>
<div id="lock"><div style="font-weight:700;font-size:18px">Ingresá tu PIN</div><div class="pins" id="pins"><i></i><i></i><i></i><i></i></div><div class="err" id="pinerr"></div><div class="pad" id="pad"></div></div>

<script>
'use strict';
/* =========================================================
   CONTROL DE CARTERA — todo local (localStorage), sin servidor.
   ========================================================= */
const KEY = 'cartera_v1';
const DEF_SETTINGS = {
  descPts: 5,            // puntos que baja la tasa si paga en efectivo
  baseInteres: 'saldo',  // 'saldo' (sobre saldo de capital) | 'fijo' (sobre capital original)
  unicoModo: 'completo', // pago único: 'completo' (mes empezado = mes entero) | 'fraccion' (días/30)
  moraPct: 8,            // % diario de recargo
  moraBase: 'saldo',     // 'saldo' (saldo impago de la cuota) | 'cuota' (monto total original de la cuota)
  moraTope: null,        // % máximo acumulado sobre la cuota; null = sin tope
  pinHash: null,
  lastBackup: null
};

/* ---------- utilidades ---------- */
const pad2 = n => String(n).padStart(2, '0');
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const EPS = 0.005;
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dnum(s){ const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
function dstr(n){ const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function addDays(s, n){ return dstr(dnum(s) + n); }
function diffDays(a, b){ return dnum(b) - dnum(a); }
function addMonths(s, n){
  let [y, m, d] = s.split('-').map(Number);
  let mm = m - 1 + n; y += Math.floor(mm / 12); mm = ((mm % 12) + 12) % 12;
  const last = new Date(Date.UTC(y, mm + 1, 0)).getUTCDate();
  return y + '-' + pad2(mm + 1) + '-' + pad2(Math.min(d, last));
}
function monthsBetween(a, b){ let m = 0; while (addMonths(a, m + 1) <= b) m++; return { m, rem: diffDays(addMonths(a, m), b) }; }
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(dnum(s));
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fdate(s){ if (!s) return '—'; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y.slice(2); }
function fdateLong(s){ const n = dnum(s); const wd = new Date(n * 864e5).getUTCDay(); const [y, m, d] = s.split('-').map(Number); return DIA[wd] + ' ' + d + ' de ' + MES[m - 1] + (y !== new Date().getFullYear() ? ' de ' + y : ''); }
const NF = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 });
function money(x){ x = Math.round(x || 0); return (x < 0 ? '−$' : '$') + NF.format(Math.abs(x)); }
function pct(x){ return NF2.format(x) + '%'; }
function parseMonto(s){
  if (typeof s === 'number') return s;
  s = String(s || '').replace(/[\s$]/g, '');
  if (!s) return NaN;
  // formato AR: 100.000,50  → miles con punto, decimales con coma
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* =========================================================
   MOTOR DE CÁLCULO (puro, sin DOM — lo usa también el autotest)
   ========================================================= */

/** Genera el cronograma de un préstamo. */
function genSchedule(L, S){
  const cap = L.capital, t = L.tasa / 100;
  if (L.tipo === 'unico'){
    const { m, rem } = monthsBetween(L.fechaEntrega, L.primerVto);
    let meses = S.unicoModo === 'fraccion' ? m + rem / 30 : m + (rem > 0 ? 1 : 0);
    if (S.unicoModo !== 'fraccion' && meses < 1) meses = 1;
    return [{ n: 1, vto: L.primerVto, capital: cap, interes: Math.round(cap * t * meses), meses: r2(meses) }];
  }
  const n = Math.max(1, L.cuotas | 0), base = Math.floor(cap / n), out = [];
  let saldo = cap;
  for (let i = 0; i < n; i++){
    const c = i === n - 1 ? r2(saldo) : base;
    const intBase = S.baseInteres === 'fijo' ? cap : saldo;
    out.push({ n: i + 1, vto: addMonths(L.primerVto, i), capital: c, interes: Math.round(intBase * t) });
    saldo = r2(saldo - c);
  }
  return out;
}

/** Factor de efectivo: tasa reducida / tasa nominal (ej 65/70). */
function cashFactor(L, S){
  const d = Number(S.descPts) || 0;
  if (d <= 0 || L.tasa <= 0) return 1;
  return Math.max(0, L.tasa - d) / L.tasa;
}

/**
 * Estado de un préstamo a una fecha: reproduce los pagos en orden cronológico.
 * Recargo: interés simple diario sobre la base elegida, con tope opcional.
 * Imputación: por cuota más antigua → recargo, interés, capital.
 * Efectivo: el interés se cancela a tasa reducida (factor k) y la diferencia es descuento.
 */
function loanState(L, payments, S, asOf){
  const pctD = (Number(S.moraPct) || 0) / 100;
  const tope = (S.moraTope === null || S.moraTope === '' || S.moraTope === undefined) ? null : Number(S.moraTope) / 100;
  const k = cashFactor(L, S);
  const cs = L.schedule.map(q => ({
    n: q.n, vto: q.vto, capital: q.capital, interes: q.interes, total: r2(q.capital + q.interes),
    capRem: q.capital, intRem: q.interes, recAcc: 0, recPaid: 0, acc: q.vto,
    intCash: 0, desc: 0, capPaid: 0, pagadaEl: null, topeOn: false
  }));
  const accrue = (c, date) => {
    if (date <= c.vto) return;
    if (c.capRem + c.intRem <= EPS) return;
    const from = c.acc > c.vto ? c.acc : c.vto;
    const days = diffDays(from, date);
    if (days <= 0) return;
    c.acc = date;
    const base = S.moraBase === 'cuota' ? c.total : r2(c.capRem + c.intRem);
    let rec = c.recAcc + base * pctD * days;
    if (tope !== null){ const mx = r2(c.total * tope); if (rec >= mx){ rec = mx; c.topeOn = true; } }
    c.recAcc = r2(Math.max(rec, c.recAcc));
  };
  const lp = payments.filter(p => p.loanId === L.id && p.fecha <= asOf)
    .sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.ts || 0) - (b.ts || 0));
  const pays = [];
  for (const p of lp){
    cs.forEach(c => accrue(c, p.fecha));
    let P = r2(p.monto);
    const kk = p.medio === 'efectivo' ? k : 1;
    const a = { id: p.id, fecha: p.fecha, monto: p.monto, medio: p.medio, rec: 0, int: 0, cap: 0, desc: 0, sobrante: 0, cuotas: [] };
    for (const c of cs){
      if (P <= EPS) break;
      const recDue = r2(c.recAcc - c.recPaid);
      if (c.capRem + c.intRem + recDue <= EPS) continue;
      let used = false;
      let x = Math.min(P, recDue);
      if (x > 0){ c.recPaid = r2(c.recPaid + x); P = r2(P - x); a.rec = r2(a.rec + x); used = true; }
      if (c.intRem > EPS && P > EPS){
        const fullCash = r2(c.intRem * kk);
        let nom, cash;
        if (P >= fullCash){ nom = c.intRem; cash = fullCash; }
        else { cash = P; nom = Math.min(c.intRem, r2(P / kk)); }
        const d = r2(nom - cash);
        c.intRem = r2(c.intRem - nom); c.intCash = r2(c.intCash + cash); c.desc = r2(c.desc + d);
        a.int = r2(a.int + cash); a.desc = r2(a.desc + d); P = r2(P - cash); used = true;
      }
      x = Math.min(P, c.capRem);
      if (x > 0){ c.capRem = r2(c.capRem - x); c.capPaid = r2(c.capPaid + x); P = r2(P - x); a.cap = r2(a.cap + x); used = true; }
      if (used) a.cuotas.push(c.n);
      if (c.capRem + c.intRem <= EPS && r2(c.recAcc - c.recPaid) <= EPS && !c.pagadaEl) c.pagadaEl = p.fecha;
    }
    a.sobrante = r2(P);
    pays.push(a);
  }
  cs.forEach(c => accrue(c, asOf));
  const T = { capital: 0, capRem: 0, intRem: 0, recRem: 0, pend: 0, pendCash: 0, mora: 0, moraCuotas: 0, recCobrado: 0, intCobrado: 0, capCobrado: 0, desc: 0, cobrado: 0, maxDias: 0 };
  for (const c of cs){
    c.recRem = r2(c.recAcc - c.recPaid);
    c.pend = r2(c.capRem + c.intRem + c.recRem);
    c.pendCash = r2(c.capRem + c.intRem * k + c.recRem);
    c.cuotaRem = r2(c.capRem + c.intRem);
    c.dias = 0;
    if (c.pend <= EPS) c.estado = 'pagada';
    else if (c.vto < asOf){ c.estado = 'mora'; c.dias = diffDays(c.vto, asOf); }
    else if (c.vto === asOf) c.estado = 'hoy';
    else c.estado = 'pendiente';
    c.parcial = c.estado !== 'pagada' && (c.capPaid + c.intCash + c.recPaid) > 0;
    T.capital += c.capital; T.capRem += c.capRem; T.intRem += c.intRem; T.recRem += c.recRem; T.pend += c.pend; T.pendCash += c.pendCash;
    if (c.estado === 'mora'){ T.mora += c.pend; T.moraCuotas++; T.maxDias = Math.max(T.maxDias, c.dias); }
  }
  for (const a of pays){ T.recCobrado += a.rec; T.intCobrado += a.int; T.capCobrado += a.cap; T.desc += a.desc; T.cobrado += a.monto - a.sobrante; }
  Object.keys(T).forEach(key => T[key] = r2(T[key]));
  const estado = T.pend <= EPS ? 'cancelado' : T.moraCuotas ? 'mora' : 'aldia';
  return { loan: L, k, cuotas: cs, pays, T, estado, asOf };
}

/** Monto sugerido a cobrar en una fecha y medio. scope: 'next' | 'vencido' | 'all' */
function quote(L, payments, S, date, medio, scope){
  const st = loanState(L, payments, S, date);
  const cash = medio === 'efectivo';
  const amt = c => cash ? c.pendCash : c.pend;
  const pend = st.cuotas.filter(c => c.pend > EPS);
  if (!pend.length) return 0;
  if (scope === 'all') return r2(pend.reduce((s, c) => s + amt(c), 0));
  if (scope === 'vencido'){
    const v = pend.filter(c => c.vto <= date);
    return r2((v.length ? v : [pend[0]]).reduce((s, c) => s + amt(c), 0));
  }
  return amt(pend[0]);
}

/** Simula un pago y devuelve su imputación. */
function simulate(L, payments, S, pay){
  const fake = Object.assign({ id: '__sim', loanId: L.id, ts: Number.MAX_SAFE_INTEGER }, pay);
  const st = loanState(L, payments.concat([fake]), S, pay.fecha);
  return st.pays.find(a => a.id === '__sim');
}

let DB, CACHE = null;
const S = () => DB.settings;
function blank(){ return { v: 1, settings: Object.assign({}, DEF_SETTINGS), clients: [], loans: [], payments: [], seeded: false }; }
function normalize(d){
  const b = blank();
  if (!d || typeof d !== 'object') return b;
  b.settings = Object.assign({}, DEF_SETTINGS, d.settings || {});
  b.clients = Array.isArray(d.clients) ? d.clients : [];
  b.loans = Array.isArray(d.loans) ? d.loans : [];
  b.payments = Array.isArray(d.payments) ? d.payments : [];
  b.seeded = !!d.seeded;
  return b;
}
function validBackup(d){
  if (!d || typeof d !== 'object' || !Array.isArray(d.clients) || !Array.isArray(d.loans) || !Array.isArray(d.payments)) return 'Faltan clientes, préstamos o pagos.';
  for (const L of d.loans){
    if (!L.id || !L.clientId || !(L.capital > 0) || !Array.isArray(L.schedule) || !isDate(L.fechaEntrega)) return 'Hay un préstamo con datos inválidos.';
  }
  for (const p of d.payments){ if (!p.id || !p.loanId || !(p.monto > 0) || !isDate(p.fecha)) return 'Hay un pago con datos inválidos.'; }
  return null;
}
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { console.error(e); } return null; }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e){ toast('⚠️ No se pudo guardar: ' + e.message); }
  CACHE = null;
}
function client(id){ return DB.clients.find(c => c.id === id); }
function loan(id){ return DB.loans.find(l => l.id === id); }

function all(){
  if (CACHE && CACHE.day === todayStr()) return CACHE;
  const today = todayStr();
  const states = new Map();
  for (const L of DB.loans) states.set(L.id, loanState(L, DB.payments, S(), today));
  CACHE = { day: today, states };
  return CACHE;
}
function stOf(id){ return all().states.get(id); }
function clientSummary(cid){
  const loans = DB.loans.filter(l => l.clientId === cid);
  let pend = 0, mora = 0, maxDias = 0, activos = 0;
  for (const L of loans){ const st = stOf(L.id); pend += st.T.pend; mora += st.T.mora; maxDias = Math.max(maxDias, st.T.maxDias); if (st.estado !== 'cancelado') activos++; }
  return { loans, pend: r2(pend), mora: r2(mora), maxDias, activos, estado: mora > EPS ? 'mora' : 'aldia' };
}

function viewRes(){
  const f = VIEW.resFiltro, mes = VIEW.resMes;
  const inP = d => f === 'total' || (d && d.slice(0, 7) === mes);
  let prestado = 0, cobrado = 0, intC = 0, recC = 0, desc = 0, capC = 0, nPrest = 0;

  for (const L of DB.loans){
    const st = stOf(L.id);
    if (inP(L.fechaEntrega)){ prestado += L.capital; nPrest++; }
    for (const a of st.pays) if (inP(a.fecha)){ cobrado += a.monto - a.sobrante; intC += a.int; recC += a.rec; desc += a.desc; capC += a.cap; }
    calle += st.T.capRem; porCobrar += st.T.pend; mora += st.T.mora; moraN += st.T.moraCuotas;
    if (f === 'mes') for (const c of st.cuotas) if (c.vto.slice(0, 7) === mes) venceMes += c.pend;
  }

  let h = backupBanner();

  if (f === 'mes') h += '<div class="calhead"><button class="iconbtn" data-act="rPrev">‹</button><h2>' + MES[m - 1] + ' ' + y + '</h2><button class="iconbtn" data-act="rNext">›</button></div>';
  const per = f === 'mes' ? 'en ' + MES[m - 1] : 'histórico';
  h += '<div class="sec-t">Movimientos ' + per + '</div><div class="kpis">';
  h += kpi('Capital prestado', prestado, nPrest + ' préstamo' + (nPrest === 1 ? '' : 's'));
  h += kpi('Total cobrado', cobrado, 'capital ' + money(capC) + ' + ganancia ' + money(gan));
  h += kpi('Ganancia realizada', gan, 'intereses + recargos cobrados, neta de descuentos', 'ok big');
  h += kpi('Intereses cobrados', intC, 'ya descontado el efectivo');
  h += kpi('Recargos por atraso cobrados', recC, '');
  h += kpi('Descuentos por efectivo', desc, 'lo que dejaste de cobrar por los ' + S().descPts + ' puntos');
  h += '</div><div class="sec-t">Foto a hoy (' + fdate(todayStr()) + ')</div><div class="kpis">';
  h += kpi('Capital en la calle', calle, 'capital prestado aún no devuelto', 'big');
  h += kpi('Plata por cobrar', porCobrar, 'capital + interés + recargos a hoy');
  h += kpi('Plata en mora', mora, moraN + ' cuota' + (moraN === 1 ? '' : 's') + ' vencida' + (moraN === 1 ? '' : 's') + ', con recargo', mora > 0 ? 'bad' : '');
  if (f === 'mes') h += kpi('Pendiente que vence en ' + MES[m - 1], venceMes, 'saldo de cuotas con vencimiento este mes');
  h += '</div><p class="muted tiny" style="margin-top:12px">Ganancia realizada = intereses + recargos efectivamente cobrados (en efectivo ya incluye el descuento). El capital devuelto no es ganancia.</p>';
  return h;
}
function kpi(l, v, s, cls){ return '<div class="kpi ' + (cls || '') + '"><div class="l">' + l + '</div><div class="v">' + money(v) + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }

function payList(pays){

function waLink(id){
  const c = client(id); if (!c || !c.tel) return null;
  let tel = String(c.tel).replace(/\D/g, '');
  if (tel.startsWith('0')) tel = tel.slice(1);
  if (!tel.startsWith('54')){ tel = tel.replace(/^(\d{2,4})15/, '$1'); tel = '549' + tel; }
  const today = todayStr(), lines = [];
  let cuota = 0, rec = 0;
  const mora = [], next = [];
  for (const L of DB.loans.filter(l => l.clientId === id)){
    const st = stOf(L.id);
    for (const q of st.cuotas){ if (q.estado === 'mora' || q.estado === 'hoy') mora.push({ L, q }); else if (q.estado === 'pendiente') next.push({ L, q }); }
  }
  const nombre = c.nombre.split(' ')[0];
  if (mora.length){
    lines.push('Hola ' + nombre + ', ¿cómo estás? Te escribo por ' + (mora.length > 1 ? 'tus cuotas' : 'tu cuota') + ':');
    for (const { L, q } of mora){
      cuota += q.cuotaRem; rec += q.recRem;
      lines.push('• Cuota ' + q.n + '/' + L.schedule.length + ' (vto. ' + fdate(q.vto) + '): ' + money(q.cuotaRem) + (q.dias ? ' + recargo por ' + q.dias + ' día' + (q.dias > 1 ? 's' : '') + ' de atraso ' + money(q.recRem) : ''));
    }
    lines.push('Monto de cuota: ' + money(cuota));
    lines.push('Recargo acumulado: ' + money(rec));
    lines.push('Total a la fecha (' + fdate(today) + '): ' + money(cuota + rec));
    lines.push('El recargo sigue sumando por día. Avisame cuándo lo pasás. ¡Gracias!');
  } else if (next.length){
    next.sort((a, b) => a.q.vto.localeCompare(b.q.vto));
    const { L, q } = next[0];
    lines.push('Hola ' + nombre + ', ¿cómo estás? Te recuerdo que el ' + fdate(q.vto) + ' vence tu cuota ' + q.n + '/' + L.schedule.length + '.');
    lines.push('Monto de cuota: ' + money(q.cuotaRem));
    lines.push('Recargo acumulado: ' + money(0));
    lines.push('Total a la fecha: ' + money(q.cuotaRem));
    lines.push('¡Gracias!');
  } else {
    lines.push('Hola ' + nombre + ', ¿cómo estás?');
  }
  return 'https://wa.me/' + tel + '?text=' + encodeURIComponent(lines.join('\n'));
}

function bindTasa(el){ $$('input[name=tasaOpt]', el).forEach(r => r.addEventListener('change', () => { const o = $('input[name=tasaOtra]', el); o.style.display = r.value === 'otra' && r.checked ? '' : (r.checked ? 'none' : o.style.display); if (r.value === 'otra' && r.checked) o.focus(); })); }
function readTasa(f){ const o = f.querySelector('input[name=tasaOpt]:checked'); if (!o) return NaN; return o.value === 'otra' ? parseMonto(f.tasaOtra.value) : Number(o.value); }

/* ---------- PIN ---------- */
async function hashPin(p){
  const txt = 'cartera:' + p;
  if (window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const ch of txt) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'd' + h;
}
function pinPad(onDone, title){
  const lock = $('#lock'); let v = '';
  lock.firstElementChild.textContent = title;
  $('#pinerr').textContent = '';
  const dots = () => $$('#pins i').forEach((i, ix) => i.classList.toggle('f', ix < v.length));
  $('#pad').innerHTML = [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : '<button type="button" data-k="' + k + '">' + k + '</button>').join('');
  $('#pad').onclick = async e => {
    const k = e.target.dataset && e.target.dataset.k; if (k === undefined) return;
    if (k === '⌫') v = v.slice(0, -1); else if (v.length < 4) v += k;
    dots();
    if (v.length === 4){ const val = v; v = ''; setTimeout(dots, 150); const res = await onDone(val); if (res === false){ $('#pinerr').textContent = 'PIN incorrecto'; } }
  };
  dots(); lock.classList.add('on');
}
function requirePin(){
  return new Promise(res => pinPad(async v => { if (await hashPin(v) === DB.settings.pinHash){ $('#lock').classList.remove('on'); res(); return true; } return false; }, 'Ingresá tu PIN'));
}
function setPin(){
  closeSheet();
  pinPad(async v1 => {
    pinPad(async v2 => {
      if (v1 !== v2){ $('#lock').classList.remove('on'); toast('Los PIN no coinciden. Probá de nuevo.'); return true; }
      DB.settings.pinHash = await hashPin(v1); save(); $('#lock').classList.remove('on'); render(); toast('PIN activado'); return true;
    }, 'Repetí el PIN');
    return true;
  }, 'Elegí un PIN de 4 dígitos');
}

  const a = t.dataset.act, d = t.dataset;
  switch (a){
    case 'close': closeSheet(); break;
    case 'mPrev': VIEW.month = addMonths(VIEW.month + '-01', -1).slice(0, 7); render(); break;
    case 'mNext': VIEW.month = addMonths(VIEW.month + '-01', 1).slice(0, 7); render(); break;
    case 'mHoy': VIEW.month = todayStr().slice(0, 7); render(); break;
    case 'rPrev': VIEW.resMes = addMonths(VIEW.resMes + '-01', -1).slice(0, 7); render(); break;
    case 'rNext': VIEW.resMes = addMonths(VIEW.resMes + '-01', 1).slice(0, 7); render(); break;
    case 'resF': VIEW.resFiltro = d.f; render(); break;
    case 'preT': VIEW.preTab = d.t; render(); break;
    case 'day': dayDetail(d.d); break;
    case 'moraList': moraList(); break;
    case 'goBackup': TAB = 'aju'; render(); break;
    case 'newLoan': e.stopPropagation(); loanForm({ d: d.d, client: d.client }); break;
    case 'newClientFromLoan': clientForm(null, cid => loanForm({ client: cid })); break;
    case 'newPay': e.stopPropagation(); payForm({ d: d.d, loan: d.loan, client: d.client }); break;
    case 'newClient': clientForm(null); break;
    case 'editClient': clientForm(d.id); break;
    case 'openClient': openClient(d.id); break;
    case 'openLoan': openLoan(d.id); break;
    case 'editSched': schedForm(d.id); break;
    case 'regenSched': {
      const L = loan(d.id);
      if (L && confirm('¿Regenerar el cronograma con los ajustes actuales? Se pierden los cambios hechos a mano.')){ L.schedule = genSchedule(L, S()); L.editado = false; save(); render(); openLoan(L.id); toast('Cronograma regenerado'); }
      break;
    }
    case 'wa': { const u = waLink(d.id); if (u) window.open(u, '_blank', 'noopener'); else toast('El cliente no tiene teléfono'); break; }
    case 'delPay': {
      const p = DB.payments.find(x => x.id === d.id);
      if (p && confirm('¿Borrar el cobro de ' + money(p.monto) + ' del ' + fdate(p.fecha) + '? Se recalcula todo el préstamo.')){ DB.payments = DB.payments.filter(x => x.id !== d.id); save(); render(); openLoan(p.loanId); toast('Cobro borrado'); }
      break;
    }
    case 'delLoan': {
      const L = loan(d.id); const n = DB.payments.filter(p => p.loanId === d.id).length;
      if (L && confirm('¿Borrar este préstamo de ' + money(L.capital) + ' y sus ' + n + ' pagos? No se puede deshacer.')){ DB.payments = DB.payments.filter(p => p.loanId !== d.id); DB.loans = DB.loans.filter(x => x.id !== d.id); save(); closeSheet(); render(); toast('Préstamo borrado'); }
      break;
    }
    case 'delClient': {
      const c = client(d.id); const ls = DB.loans.filter(l => l.clientId === d.id);
      if (c && confirm('¿Borrar a ' + c.nombre + (ls.length ? ' con sus ' + ls.length + ' préstamos y pagos' : '') + '? No se puede deshacer.')){
        const ids = new Set(ls.map(l => l.id));
        DB.payments = DB.payments.filter(p => !ids.has(p.loanId)); DB.loans = DB.loans.filter(l => !ids.has(l.id)); DB.clients = DB.clients.filter(x => x.id !== d.id);
        save(); closeSheet(); render(); toast('Cliente borrado');
      }
      break;
    }
    case 'export': exportBackup(); break;
    case 'import': $('#fileImp').click(); break;
    case 'loadDemo': if (confirm('¿Cargar datos de demostración? Se suman a tus datos y los podés borrar después.')){ loadDemo(); render(); toast('Demo cargada'); } break;
    case 'clearDemo': if (confirm('¿Borrar los datos de demostración? Tus datos propios no se tocan.')){ clearDemo(); render(); toast('Datos demo borrados'); } break;
    case 'wipe':
      if (confirm('¿Borrar TODOS los datos (clientes, préstamos, pagos y ajustes)? No se puede deshacer.') && prompt('Escribí BORRAR para confirmar') === 'BORRAR'){ DB = blank(); DB.seeded = true; save(); render(); toast('Datos borrados'); }
      break;
    case 'pinOn': setPin(); break;
    case 'pinOff':
      if (confirm('¿Desactivar el PIN?')) requirePin().then(() => { DB.settings.pinHash = null; save(); render(); toast('PIN desactivado'); });
      break;
    case 'runTest': {
      const r = autotest(false);
      $('#testOut').innerHTML = '<div class="banner ' + (r.ok ? 'info' : 'bad') + '">' + (r.ok ? '✔ Todos los casos pasan' : '✘ Hay casos que fallan') + ' (' + r.results.filter(x => x.ok).length + '/' + r.results.length + ' verificaciones)</div>' + r.results.map(x => '<div class="tiny">' + (x.ok ? '✔' : '✘') + ' <b>' + esc(x.caso) + '</b> — ' + esc(x.verificacion) + ': ' + esc(typeof x.obtenido === 'number' ? NF2.format(x.obtenido) : x.obtenido) + '</div>').join('');
      break;
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.in === 'cliQ'){ VIEW.cliQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $('[data-in=cliQ]'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (_){} }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.set;
  if (k){
    let v = e.target.value;
    if (k === 'descPts' || k === 'moraPct'){ v = parseMonto(v); if (!(v >= 0 && v <= 100)){ toast('Valor inválido (0 a 100)'); render(); return; } }
    if (k === 'moraTope'){ if (String(v).trim() === '') v = null; else { v = parseMonto(v); if (!(v > 0 && v <= 100000)){ toast('Tope inválido'); render(); return; } } }
    DB.settings[k] = v; save(); render(); toast('Ajuste guardado');
  }
  if (e.target.id === 'fileImp' && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ''; }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && CACHE && CACHE.day !== todayStr()) render(); });

/* ---------- inicio ---------- */
(async function boot(){
  DB = load();
  if (!DB){ DB = blank(); loadDemo(); }
  const t = autotest(true);
  console.info('Autotest de cálculos: ' + (t.ok ? 'OK ✔' : 'FALLÓ ✘') + ' — corré autotest() para ver el detalle.');
  if (!t.ok) console.table(t.results.filter(r => !r.ok));
  if (DB.settings.pinHash) await requirePin();
  render();
})();
</script>
</body>
